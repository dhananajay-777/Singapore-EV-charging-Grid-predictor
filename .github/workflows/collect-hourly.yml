name: Collect hourly

# Runs on GitHub's machines, so nothing depends on your laptop being awake.
# Cron is UTC. Singapore is UTC+8, so ":23" here is ":23" past every hour
# in Singapore too, because the offset is whole hours.
on:
  schedule:
    # :23, not :05. GitHub delays and drops scheduled runs when load is high,
    # and load peaks at the top of the hour; V1 got only 4-7 runs a day.
    - cron: "23 * * * *"
  workflow_dispatch:          # the Run workflow button, for testing

permissions:
  contents: write             # needed to commit the new rows back

concurrency:                  # never let two runs overlap on the same files
  group: collect-hourly
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet requests pandas openpyxl

      - name: Sample the feeds
        env:
          LTA_KEY: ${{ secrets.LTA_KEY }}
          TZ: Asia/Singapore
        run: python sg_utilisation_logger.py

      # Only data/ is committed. The CSVs are text, they compress and diff
      # well, and they are the record the workbook is rebuilt from.
      - name: Commit
        run: |
          git config user.name  "ev-collector"
          git config user.email "ev-collector@users.noreply.github.com"
          git add data/
          # nothing changed is a normal outcome, not a failure
          if git diff --staged --quiet; then
            echo "no new rows"
            exit 0
          fi
          git commit -m "sample $(TZ=Asia/Singapore date +'%Y-%m-%d %H:%M') SGT"
          # another run may have pushed while this one was working
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      # Rebuilt from every CSV collected so far, not just this sample, so the
      # workbook grows rather than being replaced.
      #
      # --history-days 0 leaves out the row-level history sheets, which keeps
      # this copy near 2 MB. It is published as an artifact rather than
      # committed: an .xlsx is a binary, so git stores a whole new copy every
      # time it changes, and committing even a small one 24 times a day runs to
      # gigabytes over a project. The repo copy is refreshed once a day by
      # build-daily.yml, with the history sheets included.
      - name: Refresh the workbook
        continue-on-error: true
        env:
          TZ: Asia/Singapore
        run: python sg_utilisation_logger.py --rebuild-only --history-days 0

      # continue-on-error: a full artifact quota stopped collection on
      # 15 Oct 2026, because this step used to run before the commit and its
      # failure meant the sample was never saved. The data is committed
      # first now, and a failed upload no longer fails the run.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: utilisation-latest
          path: output/utilisation/*.xlsx
          retention-days: 1
          overwrite: true
